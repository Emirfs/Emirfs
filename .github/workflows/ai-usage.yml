name: AI usage card

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s .github/scripts -p 'test_ai_usage_card.py'
      # The local machine pushes its snapshot to `usage-data` (scheduled task); main only changes here.
      - name: Take the latest local snapshot
        run: |
          if git fetch --depth=1 origin usage-data; then
            git checkout FETCH_HEAD -- data/ai-usage-local.json
          fi
      - run: python .github/scripts/ai_usage_card.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ai-usage.svg data/ai-usage-local.json
          git diff --cached --quiet || git commit -m "Update AI usage card"
          git push
