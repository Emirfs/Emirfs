<svg xmlns="http://www.w3.org/2000/svg" width="860" height="412" viewBox="0 0 860 412" role="img" aria-label="AI token usage by model vendor">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.t{fill:#E6EDF3;font-size:20px;font-weight:700}
.s{fill:#8B96A8;font-size:13px}
.k{fill:#E6EDF3;font-size:26px;font-weight:700}
.kl{fill:#8B96A8;font-size:12px;letter-spacing:.4px}
.n{fill:#E6EDF3;font-size:14px;font-weight:600}
.v{fill:#8B96A8;font-size:12px}
.val{fill:#E6EDF3;font-size:13px;font-weight:600}
.bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.4s cubic-bezier(.2,.8,.2,1) forwards}
.fade{opacity:0;animation:fade .6s ease forwards}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes fade{to{opacity:1}}
</style>
<rect width="860" height="412" rx="14" fill="#0D1117"/>
<rect x=".5" y=".5" width="859" height="411" rx="13.5" fill="none" stroke="#30363D"/>
